<!DOCTYPE html>
<html>
<head>
    <title>Create Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .box { max-width:420px; margin:40px auto; }
    </style>
</head>
<body>

<div class="box">
    <h2>Create Application</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form id="public-register" action="{{ url_for('apply') }}" method="POST" onsubmit="submitApplication(event)">
        <input type="text" id="name" name="name" placeholder="Full Name" required>
        <input type="number" id="age" name="age" placeholder="Age" min="0" required>
        <input type="number" id="income" name="income" placeholder="Income" min="0" step="0.01" required>
        <input type="number" id="family_size" name="family_size" placeholder="Family Size" min="1" required>

        <div id="form-error" class="form-error" aria-live="polite"></div>
        <div id="apply-result" class="apply-result" aria-live="polite"></div>

        <button type="submit">Submit Application</button>
    </form>

    <script>
    (function(){
        const form = document.getElementById('public-register');
        const err = document.getElementById('form-error');
        form.addEventListener('submit', function(e){
            err.innerText = '';
            const name = form.name.value.trim();
            const age = parseInt(form.age.value, 10);
            const income = parseFloat(form.income.value);
            const family_size = parseInt(form.family_size.value, 10);

            if (!name) {
                err.innerText = 'Full name is required'; err.style.color='red'; e.preventDefault(); return;
            }
            if (isNaN(age) || age < 0) {
                err.innerText = 'Enter a valid age'; err.style.color='red'; e.preventDefault(); return;
            }
            if (isNaN(income) || income < 0) {
                err.innerText = 'Enter a valid income'; err.style.color='red'; e.preventDefault(); return;
            }
            if (isNaN(family_size) || family_size < 1) {
                err.innerText = 'Enter a valid family size'; err.style.color='red'; e.preventDefault(); return;
            }
        });
    })();
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</div>

</body>
</html>
